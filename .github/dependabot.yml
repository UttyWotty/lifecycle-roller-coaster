# Dependabot keeps npm packages and GitHub Actions up to date with weekly grouped pull requests.
# Updates target develop, so they follow the same git flow as every other change.
# Security updates are raised as soon as an advisory is published, regardless of this schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
